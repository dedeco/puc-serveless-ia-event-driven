steps:
  # Step 1: Executar os testes unitários automatizados
  - name: 'python:3.12-slim'
    dir: 'exame-especial'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'pip install -r src/requirements.txt && python -m unittest test_main.py -v'

